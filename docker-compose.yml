name: cairn

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  image: cairn:local
  restart: unless-stopped
  env_file: ["${CAIRN_ENV_FILE:-.env}"]
  environment: &app-environment
    CAIRN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cairn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cairn}
    CAIRN_REDIS_URL: redis://redis:6379/0
    CAIRN_OBJECTSTORE__LOCAL_PATH: /var/lib/cairn/objects
    CAIRN_INGESTION__TOKENIZERS_JSON: '{"minilm":"hf:/models/tokenizer.json"}'
    CAIRN_RETRIEVAL__TOKENIZER_FILES: '{"minilm":"/models/tokenizer.json"}'
    CAIRN_MCP__MANAGED: "true"
    CAIRN_MCP__PORT_MIN: ${CAIRN_MCP_PORT_MIN:-8081}
    CAIRN_MCP__PORT_MAX: ${CAIRN_MCP_PORT_MAX:-8090}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  volumes:
    - objects:/var/lib/cairn/objects
    - type: bind
      source: ${CAIRN_MODEL_DIR:-./data/models/minilm}
      target: /models
      read_only: true
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

x-worker: &worker
  <<: *app
  command: ["python", "-m", "apps.worker.main"]
  healthcheck:
    disable: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cairn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cairn}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cairn} -d ${POSTGRES_DB:-cairn}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07
    profiles: [local-model]
    restart: unless-stopped
    command: ["--model-id", "/model", "--pooling", "mean", "--max-client-batch-size", "16", "--max-batch-tokens", "4096", "--max-concurrent-requests", "16"]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${CAIRN_MODEL_DIR:-./data/models/minilm}
        target: /model
        read_only: true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *app
    environment:
      <<: *app-environment
      CAIRN_ROLE: all
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["cairn", "migrate", "--and-bootstrap"]
    restart: "no"
    healthcheck:
      disable: true

  api-control:
    <<: *app
    environment:
      <<: *app-environment
      CAIRN_ROLE: all
    expose: ["8000"]

  api-data:
    <<: *app
    environment:
      <<: *app-environment
      CAIRN_ROLE: data
    expose: ["8000"]

  mcp-service:
    <<: *app
    command: ["python", "-m", "apps.mcp.main"]
    environment:
      <<: *app-environment
      CAIRN_ROLE: data
    ports:
      - "${CAIRN_HTTP_BIND:-127.0.0.1}:${CAIRN_MCP_PORT_MIN:-8081}-${CAIRN_MCP_PORT_MAX:-8090}:${CAIRN_MCP_PORT_MIN:-8081}-${CAIRN_MCP_PORT_MAX:-8090}"
    expose: ["8099"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-maintain:
    <<: *worker
    environment:
      <<: *app-environment
      CAIRN_ROLE: worker
      CAIRN_TASKS__QUEUE: maintain

  worker-parse:
    <<: *worker
    environment:
      <<: *app-environment
      CAIRN_ROLE: worker
      CAIRN_TASKS__QUEUE: parse

  worker-chunk:
    <<: *worker
    environment:
      <<: *app-environment
      CAIRN_ROLE: worker
      CAIRN_TASKS__QUEUE: chunk

  worker-embed:
    <<: *worker
    environment:
      <<: *app-environment
      CAIRN_ROLE: worker
      CAIRN_TASKS__QUEUE: embed

  worker-index:
    <<: *worker
    environment:
      <<: *app-environment
      CAIRN_ROLE: worker
      CAIRN_TASKS__QUEUE: index

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    image: cairn-web:local
    restart: unless-stopped
    depends_on:
      api-control: {condition: service_healthy}
      api-data: {condition: service_healthy}
      mcp-service: {condition: service_healthy}
    ports: ["${CAIRN_HTTP_BIND:-127.0.0.1}:${CAIRN_HTTP_PORT:-8080}:8080"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  objects:
