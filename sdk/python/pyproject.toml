[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-client"
version = "0.1.0"
description = "Typed sync and async clients for the Cairn knowledge API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic[email]>=2.9,<3"]
readme = "README.md"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
langchain = ["langchain-core>=1,<2"]
llamaindex = ["llama-index-core>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/cairn_client/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "S"]
ignore = ["S101"]
