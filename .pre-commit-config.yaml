repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # The boundary check runs here as well as in CI: catching an illegal
      # import at commit time is far cheaper than after a branch is built on it.
      - id: import-linter
        name: module boundaries
        entry: uv run lint-imports --config .importlinter
        language: system
        types: [python]
        pass_filenames: false

      - id: no-untagged-todo
        name: TODOs must name an owner
        entry: '(?<!\w)(TODO|FIXME)(?!\()'
        language: pygrep
        types: [python]
