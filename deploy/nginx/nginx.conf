# Cairn ingress + SPA.
#
# Path routing implements the control/data plane split (ADR-0002): the data
# plane is reachable only via the retrieval and MCP prefixes, so a control-plane
# outage cannot take retrieval down and vice versa.

upstream cairn_control {
    server api-control:8000;
    keepalive 32;
}

upstream cairn_data {
    server api-data:8000;
    keepalive 64;
}

# Rate limiting at the edge, in addition to in-application limits (NFR-SEC-13).
limit_req_zone $binary_remote_addr zone=cairn_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cairn_api:10m rate=600r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;      # matches CAIRN max_upload_bytes
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # ---- health (either tier can answer) ----
    location = /healthz { proxy_pass http://cairn_control; access_log off; }
    location = /readyz  { proxy_pass http://cairn_control; access_log off; }

    # ---- login: tight rate limit, brute force is the threat ----
    location = /v1/auth/login {
        limit_req zone=cairn_login burst=5 nodelay;
        proxy_pass http://cairn_control;
    }

    # ---- data plane (Phase 2+) ----
    location /v1/retrieval/ {
        limit_req zone=cairn_api burst=100 nodelay;
        proxy_pass http://cairn_data;
        proxy_buffering off;          # SSE / streaming responses
    }
    location /mcp {
        proxy_pass http://cairn_data;
        proxy_buffering off;
    }
    location = /retrieval {          # Dify External Knowledge API compatibility
        proxy_pass http://cairn_data;
    }

    # ---- control plane ----
    location /v1/ {
        limit_req zone=cairn_api burst=100 nodelay;
        proxy_pass http://cairn_control;
    }
    location /docs { proxy_pass http://cairn_control; }

    location /metrics {
        # Not public. Restrict to the monitoring network in production.
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://cairn_control;
    }

    # ---- SPA ----
    # Content-hashed assets are immutable and cached hard; index.html never is,
    # or a deploy would leave clients pinned to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
